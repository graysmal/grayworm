<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>grayworm how do you like my grayworm</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: black;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: min(100vw, 177.7778vh);
      aspect-ratio: 16 / 9;
    }

    .background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #bg0 {
      z-index: 0;
      animation: rotate-background 30s linear infinite;
    }

    @keyframes rotate-background {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    #bg1 {
      z-index: 1;
    }

    #bg2 {
      z-index: 2;
    }

    #valve {
      position: absolute;
      z-index: 3;

      left: 50%;
      top: 50%;
      width: 38%;

      transform: translate(-50%, -50%);

      height: auto;
      cursor: pointer;
    }

    #valve:focus-visible {
      outline: 2px solid white;
      outline-offset: 4px;
    }

    /* Black-and-white multiplication dialog. */
    dialog {
      width: min(320px, calc(100vw - 48px));
      padding: 24px;

      color: white;
      background: black;
      border: 1px solid white;

      font-family: sans-serif;
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.8);
    }

    dialog h2 {
      margin-top: 0;
      font-size: 1.2rem;
    }

    dialog p {
      line-height: 1.4;
    }

    .problem {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 12px 0;
    }

    .problem input {
      width: 90px;
      padding: 6px;

      color: white;
      background: black;
      border: 1px solid white;

      font: inherit;
    }

    dialog button {
      padding: 8px 16px;

      color: black;
      background: white;
      border: 1px solid white;

      font: inherit;
      cursor: pointer;
    }

    dialog button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    #quiz-message {
      min-height: 1.4em;
    }
  </style>
</head>

<body>
<main class="scene">
  <img
          id="bg0"
          class="background"
          src="/images/bg0.png"
          alt=""
  >

  <img
          id="bg1"
          class="background"
          src="/images/bg1.png"
          alt=""
  >

  <img
          id="bg2"
          class="background"
          src="/images/bg2.png"
          alt=""
  >

  <img
          id="valve"
          src="/images/vclose.png"
          alt="Toggle the ghost machine"
          role="button"
          tabindex="0"
  >
</main>

<dialog id="quiz-dialog" aria-labelledby="quiz-title">
  <form id="quiz-form">
    <h2 id="quiz-title">Too late.</h2>

    <p>
      Solve all three problems to close the valve.
    </p>

    <div class="problem">
      <label for="answer-0" id="question-0"></label>
      <input
              id="answer-0"
              type="number"
              inputmode="numeric"
              required
      >
    </div>

    <div class="problem">
      <label for="answer-1" id="question-1"></label>
      <input
              id="answer-1"
              type="number"
              inputmode="numeric"
              required
      >
    </div>

    <div class="problem">
      <label for="answer-2" id="question-2"></label>
      <input
              id="answer-2"
              type="number"
              inputmode="numeric"
              required
      >
    </div>

    <p id="quiz-message" aria-live="polite"></p>

    <button id="quiz-submit" type="submit">
      Submit
    </button>
  </form>
</dialog>

<script>
  const valve = document.querySelector('#valve');
  const quizDialog = document.querySelector('#quiz-dialog');
  const quizForm = document.querySelector('#quiz-form');
  const quizMessage = document.querySelector('#quiz-message');
  const quizSubmit = document.querySelector('#quiz-submit');

  const valveImages = {
    open: '/images/vopen.png',
    close: '/images/vclose.png'
  };

  const sounds = {
    open: new Audio('/media/open.mp3'),
    close: new Audio('/media/close.mp3'),
    laugh: new Audio('/media/laugh.mp3'),
    riddle: new Audio('/media/riddle.mp3'),
    response: new Audio('/media/response.mp3')
  };

  for (const sound of Object.values(sounds)) {
    sound.preload = 'auto';
  }

  let currentState = null;
  let toggling = false;
  let requestNumber = 0;

  /*
   * True while waiting for the user to click again before
   * the riddle finishes.
   */
  let waitingForRiddle = false;

  let problems = [];

  function stopAllAudio() {
    for (const sound of Object.values(sounds)) {
      sound.pause();

      try {
        sound.currentTime = 0;
      } catch (error) {
        console.error('Could not reset audio:', error);
      }
    }
  }

  function playSoundsForState(state, options = {}) {
    stopAllAudio();

    let soundsToPlay;

    if (state === 'open') {
      soundsToPlay = [
        sounds.open,
        sounds.laugh
      ];
    } else if (options.skipResponse) {
      soundsToPlay = [
        sounds.close
      ];
    } else {
      soundsToPlay = [
        sounds.close,
        sounds.response
      ];
    }

    for (const sound of soundsToPlay) {
      sound.play().catch(error => {
        console.error('Could not play audio:', error);
      });
    }
  }

  function displayState(state, options = {}) {
    if (!valveImages[state]) {
      console.error('Unknown state:', state);
      return;
    }

    const previousState = currentState;
    currentState = state;

    valve.src = valveImages[state];
    valve.alt = `my worm is ${state}. click to toggle.`;

    /*
     * If another browser closed the valve, dismiss this browser's
     * riddle or quiz as well.
     */
    if (state === 'close') {
      waitingForRiddle = false;

      if (quizDialog.open) {
        quizDialog.close();
      }
    }

    /*
     * The first response establishes the state without playing
     * a sound. Later state changes play the appropriate sounds.
     */
    if (
            previousState !== null &&
            previousState !== state
    ) {
      playSoundsForState(state, options);
    }
  }

  async function refreshState() {
    const thisRequest = ++requestNumber;

    const response = await fetch('/api/state', {
      cache: 'no-store'
    });

    if (!response.ok) {
      throw new Error('could not read the current state');
    }

    const data = await response.json();

    // Ignore an older response if a newer request was started.
    if (thisRequest !== requestNumber) {
      return;
    }

    displayState(data.state);
  }

  async function requestToggle(options = {}) {
    if (toggling) return;

    toggling = true;

    // Invalidate an older poll that may still be in progress.
    const thisRequest = ++requestNumber;

    try {
      const response = await fetch('/api/toggle', {
        method: 'POST'
      });

      if (!response.ok) {
        throw new Error('could not toggle the state');
      }

      const data = await response.json();

      if (thisRequest === requestNumber) {
        displayState(data.state, options);
      }

      return data.state;
    } finally {
      toggling = false;
    }
  }

  function randomNumber(min, max) {
    return Math.floor(
            Math.random() * (max - min + 1)
    ) + min;
  }

  function showMultiplicationQuiz() {
    if (quizDialog.open || currentState !== 'open') {
      return;
    }

    problems = [];

    for (let i = 0; i < 3; i++) {
      const first = randomNumber(2, 12);
      const second = randomNumber(2, 12);

      problems.push({
        first,
        second,
        answer: first * second
      });

      const question = document.querySelector(
              `#question-${i}`
      );

      const input = document.querySelector(
              `#answer-${i}`
      );

      question.textContent = `${first} × ${second} =`;
      input.value = '';
    }

    quizMessage.textContent = '';
    quizSubmit.disabled = false;

    quizDialog.showModal();

    document.querySelector('#answer-0').focus();
  }

  async function toggleState() {
    if (toggling || quizDialog.open) {
      return;
    }

    if (currentState === null) {
      console.error('The current state is not known yet.');
      return;
    }

    if (currentState === 'open') {
      const riddleIsPlaying =
              !sounds.riddle.paused &&
              !sounds.riddle.ended;

      if (!riddleIsPlaying) {
        stopAllAudio();

        try {
          sounds.riddle.currentTime = 0;
          waitingForRiddle = true;

          await sounds.riddle.play();
        } catch (error) {
          waitingForRiddle = false;
          console.error('Could not play the riddle:', error);
        }

        // The first click does not change the server state.
        return;
      }

      // The second click happened while the riddle was playing.
      waitingForRiddle = false;
    }

    try {
      await requestToggle();
    } catch (error) {
      console.error(error);
    }
  }

  sounds.riddle.addEventListener('ended', () => {
    if (waitingForRiddle && currentState === 'open') {
      waitingForRiddle = false;
      showMultiplicationQuiz();
    }
  });

  // Don't let Escape dismiss the quiz while the valve is open.
  quizDialog.addEventListener('cancel', event => {
    event.preventDefault();
  });

  quizForm.addEventListener('submit', async event => {
    event.preventDefault();

    const allCorrect = problems.every((problem, index) => {
      const input = document.querySelector(
              `#answer-${index}`
      );

      return (
              input.value.trim() !== '' &&
              Number(input.value) === problem.answer
      );
    });

    if (!allCorrect) {
      quizMessage.textContent =
              'Not quite. Check your answers and try again.';
      return;
    }

    quizSubmit.disabled = true;
    quizMessage.textContent = 'Closing...';

    try {
      if (currentState !== 'open') {
        quizDialog.close();
        return;
      }

      const newState = await requestToggle({
        skipResponse: true
      });

      if (newState === 'close') {
        if (quizDialog.open) {
          quizDialog.close();
        }
      } else {
        quizMessage.textContent =
                'The valve did not close. Please try again.';
      }
    } catch (error) {
      console.error(error);

      quizMessage.textContent =
              'Could not reach the server. Please try again.';
    } finally {
      quizSubmit.disabled = false;
    }
  });

  valve.addEventListener('click', toggleState);

  valve.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      toggleState();
    }
  });

  refreshState().catch(console.error);

  // Pick up changes made from another browser.
  setInterval(() => {
    if (!toggling) {
      refreshState().catch(console.error);
    }
  }, 3000);
</script>
</body>
</html>
