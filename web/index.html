<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>grayworm how do you like my grayworm</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: black;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: min(100vw, 177.7778vh);
      aspect-ratio: 16 / 9;
    }

    .background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #bg0 {
      z-index: 0;
    }

    #bg1 {
      z-index: 1;
    }

    #valve {
      position: absolute;
      z-index: 2;

      left: 50%;
      top: 50%;
      width: 38%;

      transform: translate(-50%, -50%);

      height: auto;
      cursor: pointer;
    }

    #valve:focus-visible {
      outline: 2px solid white;
      outline-offset: 4px;
    }
  </style>
</head>

<body>
<main class="scene">
  <img
          id="bg0"
          class="background"
          src="/images/bg0.png"
          alt=""
  >

  <img
          id="bg1"
          class="background"
          src="/images/bg1.png"
          alt=""
  >

  <img
          id="valve"
          src="/images/vclose.png"
          alt="Toggle the ghost machine"
          role="button"
          tabindex="0"
  >
</main>

<script>
  const valve = document.querySelector('#valve');

  const valveImages = {
    open: '/images/vopen.png',
    close: '/images/vclose.png'
  };

  /*
   * Preload the sounds. Riddle is included so it can be used later,
   * but neither transition currently plays it.
   */
  const sounds = {
    open: new Audio('/media/open.mp3'),
    close: new Audio('/media/close.mp3'),
    laugh: new Audio('/media/laugh.mp3'),
    riddle: new Audio('/media/riddle.mp3'),
    response: new Audio('/media/response.mp3')
  };

  for (const sound of Object.values(sounds)) {
    sound.preload = 'auto';
  }

  let currentState = null;
  let toggling = false;

  /*
   * Used to ignore an older polling response if a newer request
   * has already been started.
   */
  let requestNumber = 0;

  function stopAllAudio() {
    for (const sound of Object.values(sounds)) {
      sound.pause();

      try {
        sound.currentTime = 0;
      } catch (error) {
        console.error('Could not reset audio:', error);
      }
    }
  }

  function playSoundsForState(state) {
    stopAllAudio();

    const soundsToPlay = state === 'open'
            ? [sounds.open, sounds.laugh]
            : [sounds.close, sounds.response];

    // Start both sounds without waiting for the other to finish.
    for (const sound of soundsToPlay) {
      sound.play().catch(error => {
        console.error('Could not play audio:', error);
      });
    }
  }

  function displayState(state) {
    if (!valveImages[state]) {
      console.error('Unknown state:', state);
      return;
    }

    const previousState = currentState;
    currentState = state;

    valve.src = valveImages[state];
    valve.alt = `my worm is ${state}. click to toggle.`;

    /*
     * The first response establishes the initial state.
     * Play audio only when an established state changes.
     */
    if (
            previousState !== null &&
            previousState !== state
    ) {
      playSoundsForState(state);
    }
  }

  async function refreshState() {
    const thisRequest = ++requestNumber;

    const response = await fetch('/api/state', {
      cache: 'no-store'
    });

    if (!response.ok) {
      throw new Error('could not read the current state');
    }

    const data = await response.json();

    // Ignore stale responses from an earlier request.
    if (thisRequest !== requestNumber) {
      return;
    }

    displayState(data.state);
  }

  async function toggleState() {
    if (toggling) return;

    toggling = true;

    // Invalidate any state poll that was already in progress.
    const thisRequest = ++requestNumber;

    try {
      const response = await fetch('/api/toggle', {
        method: 'POST'
      });

      if (!response.ok) {
        throw new Error('could not toggle the state');
      }

      const data = await response.json();

      if (thisRequest === requestNumber) {
        displayState(data.state);
      }
    } catch (error) {
      console.error(error);
    } finally {
      toggling = false;
    }
  }

  valve.addEventListener('click', toggleState);

  valve.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      toggleState();
    }
  });

  refreshState().catch(console.error);

  // Pick up changes made from another browser.
  setInterval(() => {
    if (!toggling) {
      refreshState().catch(console.error);
    }
  }, 3000);
</script>
</body>
</html>
